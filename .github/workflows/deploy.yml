name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/build_concept_entries.py
      - run: python scripts/generate_expansion.py
      - run: python scripts/generate_books.py
      - run: python scripts/generate_maturity_content.py
      - run: python scripts/generate_cloud_guides.py
      - run: python scripts/generate_lessons.py
      - run: python scripts/generate_reference_views.py
      - run: python scripts/generate_featured_concepts.py
      - run: python scripts/generate_lab_notebooks.py
      - run: python scripts/generate_pdf.py
      - run: python scripts/generate_progress_manifest.py
      - run: python scripts/validate_content.py
      - run: python scripts/audit_book_coverage.py
      - name: Run educational code samples
        run: for sample in examples/*/main.py; do python "$sample"; done
      - name: Run labs
        run: |
          for lab in labs/*/main.py; do
            echo "Running $lab"
            python "$lab" || exit 1
          done
      - name: Run lab tests
        run: |
          for test in labs/*/test_lab.py; do
            python -m pytest "$test" -q || exit 1
          done
      - run: mkdocs build --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
